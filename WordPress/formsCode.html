<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
		.addButton, .deleteButton {
	        border-radius: 6px;
			box-sizing: border-box;
			cursor: pointer;
			display: inline-block;
			font-family: nunito,roboto,proxima-nova,"proxima nova",sans-serif;
			font-size: 16px;
			font-weight: 800;
			line-height: 16px;
			min-height: 40px;
			outline: 0;
			padding: 12px 14px;
			text-align: center;
			text-rendering: geometricprecision;
			text-transform: none;
			user-select: none;
			-webkit-user-select: none;
			touch-action: manipulation;
			vertical-align: middle;
		}
		
		.addButton {
		    background: #008000;
		    border: 1px solid #008000;
		    box-shadow: rgba(0, 0, 0, 0.1) 1px 2px 4px;
		    color: #FFFFFF;
		}

		.addButton:hover, .addButton:active {
			background-color: initial;
  			background-position: 0 0;
  			color: #008000;
		}

		.addButton:active {
  			opacity: .5;
		}
		
		.deleteButton {
		    background: #FF4742;
		    border: 1px solid #FF4742;
		    box-shadow: rgba(0, 0, 0, 0.1) 1px 2px 4px;
		    color: #FFFFFF;
		}

		.deleteButton:hover, .deleteButton:active {
			background-color: initial;
  			background-position: 0 0;
  			color: #FF4742;
		}

		.deleteButton:active {
  			opacity: .5;
		}
		
		.timeInputBox {
		    display: inline-block;
		    font-size: 16px;
		    width: 7em !important;
		    height: 2.75em !important;
		    padding: 12px 14px !important;
		}
    </style>
</head>
<body>
    <div id="inputDisplay">
        <form id="submitForm" action="https://www.kristiansenz.com/wp-admin/admin-post.php/" method="post" > <!--Change the action to the page you want to submit the form to-->
             <br>
             <input type="hidden" name="action" value="post_to_DB">
              <input class="addButton" type="submit" name="submit" value="submit">
            <input id="class0" type="text" name="class[0]" placeholder="Klasse nr. 1" pattern="([1-3]\.[a-z]{1,2})|Årgang" title="Format: Årgang eller 3.x, 2.a, 3.ux,..."> 
            <input id="gradYear0" type="text" name="gradYear[0]" placeholder="Dimittend år nr. 1" pattern="[0-9]{4}" title="Format: 2019, 1988, 2006...">
            <input id="time0" type="text" name="time[0]" placeholder="Tidspunkt nr. 1" pattern="[0-2]{1}[0-9]{1}:[0-6]{1}[0-9]{1}" title="Format: 12:34, 14:40, 09:36,..."> <br> <br>
        </form> 
    </div>
        
        <button class="addButton" onclick="addOption();">Add Class Input</button><button class="deleteButton" onclick="removeOption();">Remove Class Input</button> 

        <script> 
            var optionNumber = 1; //The first option to be added is number 1 

            function addOption() { 
                const idList = ["class", "gradYear", "time"]; //List of the first part of the id
                const placeholderList = ["Klasse nr.", "Dimittend år nr.", "Tidspunkt nr."];   //List of the first part of the placeholder
                
                const patternList = ["([1-3]\.[a-z]{1,2})|Årgang", "[0-9]{4}", "[0-2]{1}[0-9]{1}:[0-6]{1}[0-9]{1}"];
                
                var theForm = document.getElementById("submitForm"); //Get the form element

                for (let i= 0; i < 3; i++) {

                    var newOption = document.createElement("input"); //Create a new input element
                    newOption.id = idList[i] + optionNumber; 
                    newOption.name = idList[i] + "[" + optionNumber + "]"; 
                    newOption.type = "text"; 
                    newOption.placeholder = placeholderList[i] + " " + (optionNumber + 1);
                    newOption.pattern = patternList[i];

                    theForm.appendChild(newOption); 
                }
                for (let i = 0; i<2; i++){
                    g = document.createElement("br");
                    g.id = "br"+optionNumber;
                    theForm.appendChild(g);
                }
				optionNumber++;
            }
            
            function removeOption() {
                if (optionNumber < 2) {
                    alert("Cannot remove last inputBox")
                } else {
                    const idList = ["class", "gradYear", "time"]; //List of the first part of the id
                
                    optionNumber--;
                
                    for (let i=0; i< 3; i++){
                        document.getElementById(idList[i] + optionNumber).remove();
                        document.getElementById("br" + optionNumber).remove();
                    }
                }
            }
        </script>

        <!-- Displaying database content -->

        <form id="DataBaseDisplay" action="https://www.kristiansenz.com/wp-admin/admin-post.php/" method="post" > <br>
            <input class="deleteButton" type="submit" name="delete" value="Delete Selected From DataBase"> <br>
            <input class="addButton" type="submit" name="addTime" value="Add Time To Selected: "><input class="timeInputBox" type="number" name="addedTime" placeholder="Minutes" min=-720 max=720>
            <input type="hidden" name="action" value="edit_database">
            <input type="checkbox" name="checkall" value="Check All" onClick="check_all(this.form['checkall']);"> Check all<br>
        <div style="height:2em;"></div>
        
            <table class="styled-table">
                <thead>
                    <tr>
                        <th>Klasse</th>
                        <th>Årgang</th>
                        <th>Tidspunkt</th>
                    </tr>
                </thead>
                <tbody id="adminDisplayTable">
                </tbody>
            </table>
        </form> 
    
    <script>
        /** Check all checkboxes with the name starting with "checkbox_" when the "Check all" checkbox is checked, and uncheck them when it is unchecked.
            *  @param object initial_checkbox The "Check all" checkbox that was clicked.
            *  @return void
            */
            function check_all(initial_checkbox) {
                var checkboxes = document.querySelectorAll('input[type=\"checkbox\"]'); //Get all checkboxes on the page
                if (initial_checkbox.checked) { //If the "Check all" checkbox is checked, check all checkboxes with the name starting with "checkbox_"
                    for (let checkbox of checkboxes) {
                        if (checkbox.name.startsWith("checkbox_") && !checkbox.checked) { //If the checkbox is one of the checkboxes to be checked and is not already checked, check it
                            checkbox.checked = true;
                        }  
                    }
                } else {
                    for (let checkbox of checkboxes) {
                        if (checkbox.name.startsWith("checkbox_") && checkbox.checked) {
                            checkbox.checked = false;
                        }  
                    }
                }
            }
        </script>
    </body>
</html>
